[project]
name = "hat"
version = "0.0.1"
description = "Hippocampus-Augmented Transformer reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "loguru>=0.7",
    "rich>=13.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "gradio>=4.30",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch>=2.2", "accelerate>=0.30"]
mlx = ["mlx-lm>=0.18"]
vllm = ["vllm>=0.4"]
ollama = ["ollama>=0.2"]
train = ["peft>=0.11", "datasets>=2.19"]
vector = ["chromadb>=0.5", "sentence-transformers>=2.7"]
ui = ["streamlit>=1.34"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
hat = "hat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hat"]

[tool.hatch.build.targets.wheel.force-include]
"src/hat/models/catalogs" = "hat/models/catalogs"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
files = ["src/hat"]
