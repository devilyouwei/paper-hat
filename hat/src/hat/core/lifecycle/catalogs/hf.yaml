# Default catalog of HuggingFace causal-LM models. Override at
# ``<HAT_MODEL_ROOT>/hf/catalog.yaml``. See ``mlx.yaml`` for field definitions.
#
# Qwen2.5 entries below are the **-Instruct** variants. The plain
# ``Qwen/Qwen2.5-*`` repos are *base* checkpoints with no chat template and
# no instruction tuning; feeding them through the chat path produces fluent
# but off-task continuations (multi-language drift, role-name leakage, loops).
# Always pick an Instruct/Chat checkpoint for the conversational UI.
