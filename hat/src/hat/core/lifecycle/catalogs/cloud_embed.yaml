# Cloud embedding catalog (OpenAI-compatible /v1/embeddings endpoints).
#
# Like the cloud LLM catalog, these models call a remote API: no local
# weights, platform-independent, always "installed".
#
# Field notes:
#   id          local identifier used in the API / UI.
#   repo_id     repurposed as the *remote model name* (e.g.
#               "text-embedding-3-small").
#   base_url    OpenAI-compatible API root, WITHOUT the trailing
#               "/embeddings" (e.g. "https://api.openai.com/v1").
#   api_key_env name of the environment variable holding the API key.
#
- id: text-embedding-3-small
  repo_id: text-embedding-3-small
  display: OpenAI text-embedding-3-small
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  notes: 1536d embedder, low cost. Requires OPENAI_API_KEY.

- id: text-embedding-3-large
  repo_id: text-embedding-3-large
  display: OpenAI text-embedding-3-large
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  notes: 3072d embedder, higher quality. Requires OPENAI_API_KEY.
