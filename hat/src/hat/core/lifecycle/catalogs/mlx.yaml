# Default catalog of MLX-format models. Override by placing a YAML with the
# same shape at ``<HAT_MODEL_ROOT>/mlx/catalog.yaml`` (default: ``model/mlx/catalog.yaml``).
# Each entry:
#   id        — slug used for the local directory under model/mlx/<id>/
#   repo_id   — HuggingFace repository to snapshot_download from
#   display   — human-readable name shown in the UI
#   size_gb   — approximate on-disk footprint after download
#   notes     — free-form note, displayed as tooltip / subtitle
#
# Qwen2.5 entries below point at the **-Instruct-4bit** mlx-community repos.
# The plain ``mlx-community/Qwen2.5-*-4bit`` repos are base checkpoints (no
# chat template, no instruction tuning); using them in the chat UI produces
# multi-language drift / role-name leakage / loops. Always pick an Instruct
# checkpoint for conversational use.
- id: qwen2.5-0.5b-instruct-4bit
  repo_id: mlx-community/Qwen2.5-0.5B-Instruct-4bit
  display: Qwen2.5 0.5B Instruct (4-bit)
  size_gb: 0.3
  notes: Tiny instruct model. Good for smoke tests on any M-series Mac.
- id: qwen2.5-1.5b-instruct-4bit
  repo_id: mlx-community/Qwen2.5-1.5B-Instruct-4bit
  display: Qwen2.5 1.5B Instruct (4-bit)
  size_gb: 1.0
  notes: Better quality than 0.5B, still tiny footprint.
- id: qwen2.5-3b-instruct-4bit
  repo_id: mlx-community/Qwen2.5-3B-Instruct-4bit
  display: Qwen2.5 3B Instruct (4-bit)
  size_gb: 1.9
  notes: Better quality, still fits 8GB.
- id: qwen2.5-7b-instruct-4bit
  repo_id: mlx-community/Qwen2.5-7B-Instruct-4bit
  display: Qwen2.5 7B Instruct (4-bit)
  size_gb: 4.3
  notes: 4-bit 7B Instruct. Fits 8GB M1 with limited context; comfortable on 16GB+.
- id: qwen2.5-14b-instruct-4bit
  repo_id: mlx-community/Qwen2.5-14B-Instruct-4bit
  display: Qwen2.5 14B Instruct (4-bit)
  size_gb: 8.3
  notes: 4-bit 14B Instruct. Needs 16GB+ unified memory.

