# Default catalog of MLX-format embedding models. Override by placing a YAML
# with the same shape at ``<HAT_MODEL_ROOT>/mlx_embed/catalog.yaml``.
#
#   id        — slug used for the local directory under model/mlx_embed/<id>/
#   repo_id   — HuggingFace repository to snapshot_download from
#   display   — human-readable name shown in the UI
#   size_gb   — approximate on-disk footprint after download
#   notes     — free-form note, displayed as tooltip / subtitle

- id: embeddinggemma-300m-4bit
  repo_id: mlx-community/embeddinggemma-300m-4bit
  display: EmbeddingGemma 300M (4-bit)
  size_gb: 0.2
  notes: Small multilingual embedder, fast on M-series.

- id: qwen3-embedding-0.6b-8bit
  repo_id: mlx-community/Qwen3-Embedding-0.6B-8bit
  display: Qwen3 Embedding 0.6B (8-bit)
  size_gb: 0.7
  notes: Higher quality multilingual embedder.
