<div class="models-page">
  <div class="card">
    <div class="card-header">
      <h2>Model catalog</h2>
      <div class="row gap" id="models-summary">
        <span class="badge" id="models-count-installed">0 installed</span>
        <span class="badge subtle" id="models-count-total">0 total</span>
      </div>
    </div>
    <p class="hint">
      Browse the catalog, download weights into <code>model/&lt;backend&gt;/&lt;id&gt;/</code>,
      activate one as the Cortex, or delete weights you no longer need.
    </p>

    <div class="models-toolbar">
      <label>Backend
        <select id="mgr-backend">
          <option value="mlx">mlx</option>
          <option value="hf">hf</option>
        </select>
      </label>

      <label>Filter
        <select id="mgr-filter">
          <option value="all">All</option>
          <option value="installed">Installed</option>
          <option value="missing">Not installed</option>
        </select>
      </label>

      <label class="grow">Search
        <input type="search" id="mgr-search"
               placeholder="filter by id, repo, or notes…"
               autocomplete="off" />
      </label>

      <button class="ghost small" id="mgr-refresh" title="Refresh catalog">↻</button>
    </div>

    <pre class="status mono" id="mgr-status"></pre>
  </div>

  <div class="model-grid" id="model-grid"></div>
</div>
