<div class="chat-grid">
  <!-- col 1: session sidebar -->
  <aside class="sidebar">
    <button class="primary block" id="new-chat-btn">
      <span aria-hidden="true">＋</span> New chat
    </button>
    <h3 class="section-label">Sessions</h3>
    <ul class="session-list" id="session-list"></ul>
    <button class="danger ghost block small" id="delete-session-btn">Delete current</button>
    <p class="status" id="session-status"></p>
  </aside>

  <!-- col 2: chat area -->
  <div class="chat-main card">
    <!-- model selector row (all items aligned by a shared flex row with labels) -->
    <div class="model-bar">
      <label>Backend
        <select id="chat-backend">
          <option value="mlx">mlx</option>
          <option value="hf">hf</option>
        </select>
      </label>
      <label class="grow">Model
        <select id="chat-model"></select>
      </label>
      <label>Operation
        <div class="row gap">
          <button id="chat-use-btn">Active</button>
          <button class="ghost" id="chat-unload-btn">Unload</button>
        </div>
      </label>
    </div>

    <div id="chatbox" class="chatbox" aria-live="polite"></div>

    <form id="chat-form" class="chat-input">
      <textarea id="msg" placeholder="Ask anything…  (Shift+Enter for newline)"
                rows="2" autofocus></textarea>
      <button class="primary send-btn" type="submit" id="send-btn">
        <span class="send-label">Send</span>
        <span class="send-arrow" aria-hidden="true">→</span>
      </button>
    </form>

    <!-- Always-visible generation settings, pinned right under the composer
         for one-glance access. Kept compact so the chat area stays roomy. -->
    <div class="gen-settings-inline" id="gen-settings-inline">
      <span class="gen-settings-label">Generation</span>
      <div class="gen-settings-row">
        <label>Temperature
          <input type="number" id="temp" min="0" max="1.5" step="0.05" value="0.7" />
        </label>
        <label>Max tokens
          <input type="number" id="max-tokens" min="32" max="4096" step="32" value="512" />
        </label>
        <label class="check">
          <input type="checkbox" id="enable-thinking" />
          <span>Enable thinking <small class="muted">(Qwen3 &lt;think&gt;…)</small></span>
        </label>
      </div>
    </div>
  </div>

  <!-- col 3: trace lifecycle -->
  <aside class="trace-panel card" id="trace-panel">
    <div class="trace-panel-head">
      <h3 class="section-label" style="margin:0">Trace activity</h3>
      <button class="ghost small" id="trace-clear-btn" title="Clear list">Clear</button>
    </div>
    <p class="muted small" id="trace-empty">No traces yet for this session.</p>
    <ul class="trace-timeline" id="trace-timeline"></ul>
  </aside>
</div>
