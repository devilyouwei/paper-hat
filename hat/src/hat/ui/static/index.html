<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HAT — Hippocampus-Augmented Transformer</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/ui/static/icon.png" type="image/png" />
  <link rel="stylesheet" href="/ui/static/style.css?v=12" />
  <!-- Apply saved theme before first paint to avoid a flash of the wrong
       palette. Looks at localStorage first, then OS preference. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("hat-theme");
        var prefersLight =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        var effective = saved || (prefersLight ? "light" : "dark");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
        document.documentElement.dataset.effectiveTheme = effective;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="HAT home">
      <img class="logo" src="/ui/static/icon.png" alt="HAT" />
    </a>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab active" data-tab="chat" role="tab">
        <span class="tab-icon" aria-hidden="true">💬</span>Chat
      </button>
      <button class="tab" data-tab="models" role="tab">
        <span class="tab-icon" aria-hidden="true">📦</span>Models
      </button>
      <button class="tab" data-tab="memory" role="tab">
        <span class="tab-icon" aria-hidden="true">🧠</span>Memory
      </button>
    </nav>

    <div class="topbar-status">
      <span class="badge" id="active-model" title="Active Cortex">Active: —</span>
      <button class="theme-toggle" id="theme-toggle"
              aria-label="Toggle theme" title="Toggle light/dark theme">
        <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
        <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
      </button>
      <span class="dot" id="health-dot" title="Server status"></span>
    </div>
  </header>

  <main id="tab-host">
    <section class="panel active" id="tab-chat" data-partial="chat"></section>
    <section class="panel" id="tab-models" data-partial="models"></section>
    <section class="panel" id="tab-memory" data-partial="memory"></section>
  </main>

  <script src="/ui/static/js/main.js" type="module"></script>
</body>
</html>
